name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable semantic versioning: vX.Y.Z"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          repository_version="$(
            sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p'               Directory.Build.props
          )"

          if [ "$version" != "$repository_version" ]; then
            echo "Tag version $version does not match VersionPrefix $repository_version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Construction.sln

      - name: Verify formatting
        run: >
          dotnet format Construction.sln
          --verify-no-changes
          --no-restore
          --verbosity minimal

      - name: Build
        run: dotnet build Construction.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --solution Construction.sln
          --configuration Release
          --no-build
          --minimum-expected-tests 10

      - name: Vulnerability scan
        run: dotnet list Construction.sln package --vulnerable --include-transitive

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=Construction Management REST API
            org.opencontainers.image.description=.NET 10 construction management REST backend
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Publish release summary
        run: |
          {
            echo "### Container image"
            echo
            echo "Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs:
      - verify
      - publish-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload               "$GITHUB_REF_NAME"               docker-compose.production.yml               .env.example               --clobber
          else
            gh release create               "$GITHUB_REF_NAME"               docker-compose.production.yml               .env.example               --verify-tag               --generate-notes               --title "Construction Management REST API $GITHUB_REF_NAME"
          fi
