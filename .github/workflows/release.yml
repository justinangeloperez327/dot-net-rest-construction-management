name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish or retry, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      source_sha: ${{ steps.version.outputs.source_sha }}
      short_sha: ${{ steps.version.outputs.short_sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use stable semantic versioning: vX.Y.Z"
            exit 1
          fi

          git fetch --tags origin

          if ! git rev-parse --verify "refs/tags/$release_tag" > /dev/null 2>&1; then
            echo "Release tag $release_tag does not exist."
            exit 1
          fi

          version="${release_tag#v}"
          repository_version="$(
            sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p'               Directory.Build.props
          )"

          if [ "$version" != "$repository_version" ]; then
            echo "Tag version $version does not match VersionPrefix $repository_version."
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$release_tag")"
          checked_out_sha="$(git rev-parse HEAD)"

          if [ "$source_sha" != "$checked_out_sha" ]; then
            echo "Checked out commit does not match tag $release_tag."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${source_sha:0:12}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Construction.sln

      - name: Verify formatting
        run: >
          dotnet format Construction.sln
          --verify-no-changes
          --no-restore
          --verbosity minimal

      - name: Build
        run: dotnet build Construction.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --solution Construction.sln
          --configuration Release
          --no-build
          --minimum-expected-tests 10

      - name: Vulnerability scan
        run: dotnet list Construction.sln package --vulnerable --include-transitive

  publish-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.verify.outputs.version }}
            type=raw,value=sha-${{ needs.verify.outputs.short_sha }}
          flavor: |
            latest=true
          labels: |
            org.opencontainers.image.title=Construction Management REST API
            org.opencontainers.image.description=.NET 10 construction management REST backend
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.source_sha }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ needs.verify.outputs.source_sha }}
          provenance: mode=max
          sbom: true

      - name: Publish release summary
        run: |
          {
            echo "### Container image"
            echo
            echo "Registry: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`"
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs:
      - verify
      - publish-image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.release_tag }}

      - name: Create or refresh GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload               "$RELEASE_TAG"               docker-compose.production.yml               .env.example               --clobber
          else
            gh release create               "$RELEASE_TAG"               docker-compose.production.yml               .env.example               --verify-tag               --generate-notes               --title "Construction Management REST API $RELEASE_TAG"
          fi
