name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Construction.sln

      - name: Verify formatting
        run: >
          dotnet format Construction.sln
          --verify-no-changes
          --no-restore
          --verbosity minimal

      - name: Build
        run: dotnet build Construction.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test
          --solution Construction.sln
          --configuration Release
          --no-build
          --results-directory artifacts/test-results
          --minimum-expected-tests 10
          --coverage
          --coverage-output-format cobertura

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
