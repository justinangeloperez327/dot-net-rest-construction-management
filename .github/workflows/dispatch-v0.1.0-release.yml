name: Dispatch v0.1.0 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-v0.1.0-release.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Remove dispatcher and trigger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/dispatch-v0.1.0-release.yml
          git commit -m "chore: remove v0.1.0 release dispatcher"
          git push origin HEAD:main

          gh workflow run release.yml --ref main -f tag=v0.1.0
