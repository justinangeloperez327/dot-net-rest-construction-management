name: Bootstrap v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v0.1.0.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create clean release tag
        run: |
          set -euo pipefail

          git fetch --tags origin

          if git rev-parse --verify "refs/tags/v0.1.0" > /dev/null 2>&1; then
            echo "Tag v0.1.0 already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm .github/workflows/bootstrap-v0.1.0.yml
          git commit -m "chore: remove v0.1.0 bootstrap workflow"
          git push origin HEAD:main

          git tag -a v0.1.0 -m "Construction Management REST API v0.1.0"
          git push origin v0.1.0
