name: Generate Identity Migration
# one-time Group 6 schema generation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-identity-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore Construction.sln

      - name: Generate migration
        run: >
          dotnet ef migrations add InitialIdentity
          --project src/Construction.Infrastructure/Construction.Infrastructure.csproj
          --startup-project src/Construction.Api/Construction.Api.csproj
          --output-dir Persistence/Migrations

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Construction.Infrastructure/Persistence/Migrations
          git commit -m "feat: add initial identity migration"
          git push origin HEAD:main
