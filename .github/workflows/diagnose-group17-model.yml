name: Diagnose Group 17 EF Model

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-group17-model.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Testing
      DOTNET_ENVIRONMENT: Testing
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=construction_tests;Username=construction;Password=construction
      Authentication__Jwt__Issuer: Construction.IntegrationTests
      Authentication__Jwt__Audience: Construction.IntegrationTests.Client
      Authentication__Jwt__SigningKey: integration-testing-signing-key-2026-at-least-32-bytes
      FileStorage__RootPath: data/test-uploads

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore Construction.sln
      - name: Check pending model changes
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Construction.Infrastructure/Construction.Infrastructure.csproj
          --startup-project src/Construction.Api/Construction.Api.csproj
