name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --target runtime -t construction-api:ci .

      - name: Verify non-root runtime configuration
        run: |
          configured_user="$(docker image inspect construction-api:ci --format '{{.Config.User}}')"
          test "$configured_user" = "app"

          healthcheck="$(docker image inspect construction-api:ci --format '{{json .Config.Healthcheck.Test}}')"
          test "$healthcheck" != "null"

      - name: Validate production Compose
        env:
          CONSTRUCTION_API_IMAGE: construction-api:ci
          POSTGRES_PASSWORD: production-compose-test-database-password
          JWT_SIGNING_KEY: production-compose-test-signing-key-at-least-32-bytes
          ALLOWED_ORIGIN: https://construction.example.test
          ALLOWED_HOSTS: api.construction.example.test
          OTLP_ENDPOINT: ""
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Start container stack
        env:
          JWT_SIGNING_KEY: development-only-signing-key-change-before-use-2026
        run: |
          docker compose up --build -d

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error               http://127.0.0.1:8080/health/ready > /dev/null; then
              exit 0
            fi

            sleep 2
          done

          docker compose ps -a
          docker compose logs --no-color
          exit 1

      - name: Verify container health
        run: |
          container_id="$(docker compose ps -q api)"
          test -n "$container_id"

          for attempt in $(seq 1 30); do
            status="$(docker inspect "$container_id" --format '{{.State.Health.Status}}')"

            if [ "$status" = "healthy" ]; then
              exit 0
            fi

            if [ "$status" = "unhealthy" ]; then
              docker compose ps -a
              docker compose logs --no-color api
              exit 1
            fi

            sleep 2
          done

          docker compose ps -a
          docker compose logs --no-color api
          exit 1

      - name: Tear down container stack
        if: always()
        run: docker compose down --volumes --remove-orphans
