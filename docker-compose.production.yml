services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-construction}
      POSTGRES_USER: ${POSTGRES_USER:-construction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - construction-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-construction} -d ${POSTGRES_DB:-construction}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    image: ${CONSTRUCTION_API_IMAGE:-construction-api:latest}
    command: ["--migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-construction};Username=${POSTGRES_USER:-construction};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Api__AllowedOrigins__0: ${ALLOWED_ORIGIN:?ALLOWED_ORIGIN is required}
      Api__TrustedProxies__0: ${TRUSTED_PROXY_IP:-}
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      FileStorage__RootPath: /app/data/uploads
      FileStorage__MaximumFileSizeBytes: ${MAXIMUM_FILE_SIZE_BYTES:-104857600}
      Observability__ServiceName: ${OTEL_SERVICE_NAME:-Construction.Api}
      Observability__TraceSamplingRatio: ${TRACE_SAMPLING_RATIO:-0.1}
      Observability__OtlpEndpoint: ${OTLP_ENDPOINT:-}
    volumes:
      - construction-files:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${CONSTRUCTION_API_IMAGE:-construction-api:latest}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8080"
    environment: *api-environment
    volumes:
      - construction-files:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s

volumes:
  construction-postgres:
  construction-files:
