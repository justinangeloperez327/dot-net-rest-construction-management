services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=construction;Username=construction;Password=construction
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-2026}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: construction
    ports:
      - "5432:5432"
    volumes:
      - construction-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction -d construction"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  construction-postgres:
