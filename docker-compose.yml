services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: construction
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: construction
    ports:
      - "5432:5432"
    volumes:
      - construction-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U construction -d construction"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: construction-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=construction;Username=construction;Password=construction
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-2026}
      FileStorage__RootPath: /app/data/uploads
    volumes:
      - construction-files:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: construction-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=construction;Username=construction;Password=construction
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-use-2026}
      FileStorage__RootPath: /app/data/uploads
      FileStorage__MaximumFileSizeBytes: 104857600
    volumes:
      - construction-files:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 35s

volumes:
  construction-postgres:
  construction-files:
